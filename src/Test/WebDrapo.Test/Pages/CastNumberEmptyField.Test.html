<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head>
    <script src="/drapo.js"></script>
    <title>Cast Number Empty Field</title>
</head>
<body>
    <br>
    <span>Cast Number Empty Field</span>
    <!-- Six fields, some blank (customer repro) -->
    <div d-datakey="a1" d-datatype="value" d-datavalue="10"></div>
    <div d-datakey="a2" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="a3" d-datatype="value" d-datavalue="5"></div>
    <div d-datakey="a4" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="a5" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="a6" d-datatype="value" d-datavalue=""></div>
    <!-- All blank -->
    <div d-datakey="b1" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="b2" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="b3" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="b4" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="b5" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="b6" d-datatype="value" d-datavalue=""></div>
    <!-- Decimal partial fill (for Round composition) -->
    <div d-datakey="c1" d-datatype="value" d-datavalue="2.6"></div>
    <div d-datakey="c2" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="c3" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="c4" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="c5" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="c6" d-datatype="value" d-datavalue=""></div>
    <!-- Leading blank -->
    <div d-datakey="d1" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="d2" d-datatype="value" d-datavalue="7"></div>
    <div d-datakey="d3" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="d4" d-datatype="value" d-datavalue="3"></div>
    <div d-datakey="d5" d-datatype="value" d-datavalue=""></div>
    <div d-datakey="d6" d-datatype="value" d-datavalue=""></div>
    <div>
        <span>partial sum (10 + blanks + 5): </span><span id="r1" d-model="Cast({{a1}}+{{a2}}+{{a3}}+{{a4}}+{{a5}}+{{a6}},number)">15</span><br>
        <span>all blank: </span><span id="r2" d-model="Cast({{b1}}+{{b2}}+{{b3}}+{{b4}}+{{b5}}+{{b6}},number)">0</span><br>
        <span>decimal partial sum: </span><span id="r3" d-model="Cast({{c1}}+{{c2}}+{{c3}}+{{c4}}+{{c5}}+{{c6}},number)">2.6</span><br>
        <span>round of decimal partial: </span><span id="r4" d-model="Round(Cast({{c1}}+{{c2}}+{{c3}}+{{c4}}+{{c5}}+{{c6}},number),0)">3</span><br>
        <span>leading blank sum (blank + 7 + blank + 3): </span><span id="r5" d-model="Cast({{d1}}+{{d2}}+{{d3}}+{{d4}}+{{d5}}+{{d6}},number)">10</span><br>
    </div>


</body></html>
