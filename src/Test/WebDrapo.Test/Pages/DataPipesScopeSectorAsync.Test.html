<!DOCTYPE html><html><head>
    <script src="/drapo.js"></script>
    <title>Data Pipes Scope Sector</title>
</head>
<body>
    <span>Data Pipes Scope Sector</span>
    <div d-datakey="resetA" d-datatype="value" d-dataloadtype="startup" d-dataurlget="~/Data/GetCallCount?name=DataPipesScopeSectorA&amp;reset=true"></div>
    <div d-datakey="resetB" d-datatype="value" d-dataloadtype="startup" d-dataurlget="~/Data/GetCallCount?name=DataPipesScopeSectorB&amp;reset=true"></div>
    <div d-datakey="update" d-datatype="value" d-dataloadtype="startup" d-dataurlset="~/Plumber/Notify?datakey=pipeScope"></div>
    <div d-datakey="loaderA" d-datatype="function" d-dataloadtype="startup" d-datavalue="ShowWindow(~/DrapoPages/DataPipesScopeSectorWindowA.html,windowA)"></div>
    <div d-datakey="loaderB" d-datatype="function" d-dataloadtype="startup" d-datavalue="ShowWindow(~/DrapoPages/DataPipesScopeSectorWindowB.html,windowB)"></div>
    <div d-sector="@" d-id="windowA"><div d-sector="@">
    <div d-datakey="pipeCalls" d-datatype="value" d-dataaccess="private" d-dataloadtype="startup" d-dataurlget="~/Data/GetCallCount?name=DataPipesScopeSectorA" d-datapipes="pipeScope" d-datapipesscope="sector"></div>
    <span>A: </span><span d-model="{{pipeCalls}}">2</span>
</div></div>
    <div d-sector="@" d-id="windowB"><div d-sector="@">
    <div d-datakey="pipeCalls" d-datatype="value" d-dataaccess="private" d-dataloadtype="startup" d-dataurlget="~/Data/GetCallCount?name=DataPipesScopeSectorB"></div>
    <span>B: </span><span d-model="{{pipeCalls}}">1</span>
</div></div>
    <input type="button" value="Notify" d-id="__drapoUnitTest" d-on-click="PostDataItem(update)">


</body></html>
