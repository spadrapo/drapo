<html><head>
    <script src="/drapo.js"></script>
    <title>Control Flow For Concurrent Render</title>
</head>
<body>
    <span>Control Flow For Concurrent Render</span>
    <div d-datakey="reset" d-datatype="value" d-dataloadtype="startup" d-dataurlget="~/Data/GetCallCount?name=ControlFlowForConcurrentRender&amp;reset=true"></div>
    <div d-datakey="items" d-datatype="array" d-datavalue="[{&quot;id&quot;:1,&quot;name&quot;:&quot;One&quot;}]"></div>
    <div d-datakey="itemTwo" d-datatype="object" d-datavalue="{&quot;id&quot;:2,&quot;name&quot;:&quot;Two&quot;}"></div>
    <div d-datakey="itemThree" d-datatype="object" d-datavalue="{&quot;id&quot;:3,&quot;name&quot;:&quot;Three&quot;}"></div>
    <div d-datakey="slow" d-datatype="value" d-dataurlget="~/Data/GetCallCountDelayed?name=ControlFlowForConcurrentRender&amp;delay=1000"></div>
    <div d-if="{{slow}}&gt;0"><span>Slow</span></div>
    <div class="rows">
        <span>Rows</span>
        <div d-for="item in items" style="display: none;">
            <span>{{item.name}}</span>
            <span d-if="({{item.id}}=3)&amp;&amp;({{slow}}&gt;0)">Loaded</span>
        </div><div>
            <span>One</span>
            
        </div><div>
            <span>Two</span>
            
        </div><div>
            <span>Three</span>
            <span>Loaded</span>
        </div>
    </div>
    <input type="button" value="Render" driverunittest="click" d-on-click="UnloadData(slow);AddDataItem(items,{{itemTwo}},false);AddDataItem(items,{{itemThree}},false);Async(Notify(items));Async(Notify(items),200)">


</body></html>
