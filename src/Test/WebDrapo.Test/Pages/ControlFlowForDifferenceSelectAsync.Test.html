<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head>
    <script src="/drapo.js"></script>
    <title>Control Flow For Difference Select Async</title>
</head>
<body>
    <span>Control Flow For Difference Select Async</span>
    <div d-datakey="rows" d-datatype="array" d-datavalue="[{&quot;name&quot;:&quot;A&quot;,&quot;value&quot;:&quot;x&quot;,&quot;options&quot;:[{&quot;key&quot;:&quot;x&quot;}]},{&quot;name&quot;:&quot;B&quot;,&quot;value&quot;:&quot;&quot;,&quot;options&quot;:[]},{&quot;name&quot;:&quot;E&quot;,&quot;value&quot;:&quot;x&quot;,&quot;options&quot;:[{&quot;key&quot;:&quot;x&quot;}]}]"></div>
    <div d-datakey="rowsNew" d-datatype="array" d-datavalue="[{&quot;name&quot;:&quot;C&quot;,&quot;value&quot;:&quot;c&quot;,&quot;options&quot;:[{&quot;key&quot;:&quot;a&quot;},{&quot;key&quot;:&quot;b&quot;},{&quot;key&quot;:&quot;c&quot;}]},{&quot;name&quot;:&quot;D&quot;,&quot;value&quot;:&quot;b&quot;,&quot;options&quot;:[{&quot;key&quot;:&quot;a&quot;},{&quot;key&quot;:&quot;b&quot;}]},{&quot;name&quot;:&quot;F&quot;,&quot;value&quot;:&quot;a&quot;,&quot;options&quot;:[{&quot;key&quot;:&quot;a&quot;}]}]"></div>
    <div>
        <div d-for="row in rows" class="row" style="display: none;"><b>{{row.name}}</b><select class="row-select" d-model="{{row.value}}"><option d-for="option in row.options" value="{{option.key}}">{{option.key}}</option></select></div><div class="row"><b>C</b><select class="row-select" style=""><option value="a">a</option><option value="b">b</option><option value="c">c</option></select></div><div class="row"><b>D</b><select class="row-select" style=""><option value="a">a</option><option value="b">b</option></select></div><div class="row"><b>F</b><select class="row-select" style=""><option value="a">a</option></select></div>
        <span>End</span>
    </div>
    <div d-datakey="loader" d-datatype="function" d-dataloadtype="startup" d-datavalue="Async(UpdateData(rows,{{rowsNew}},false);Notify(rows),100)"></div>


</body></html>
